# ============================================================
# 职业定义（全局配置，火焰纹章式上下位体系）
#
# 字段说明：
#   name         显示名
#   move_type    移动类型：foot 步兵 / mounted 骑兵 / flying 飞行 / armor 重甲
#   groups       职业类别标签，决定被哪些特效武器克制
#   stats        职业属性加成
#   growth       职业成长率
#   weapon_types 可装备武器类型
#   skill_learn  升级习得技能表：[{level: N, skill: id}]  —— 升到 N 级学会
#   class_skills 职业授予的主动/被动技能：[steal, xxx_mastery]  —— 转职即有
#   promote      转职线 {level, item, to}
#
# ════════════════════════════════════════════════════════════
# 关于 force_base / max_level（v7.4b）
#
# 普通职业不用配这两个字段，走全局默认：
#   - 有 promote 段 → 自动判下位，等级上限走 max_level（默认 20）
#   - 无 promote 段 → 自动判上位，等级上限走 max_level_promoted（默认 20）
#
# 只有"无 promote 段但想按下位算 + 能升到更高等级"的特殊职业
# （dancer / beast / wyvern_beast / ogre / centaur）才需要配：
#
#   force_base: true   强制按下位算（total_level = level，不是 20 + level）
#   max_level: 40      等级上限 40（不写走全局 20）
#
# ⚠ 注意事项：
#   1. force_base 只写 true，不要写 false（false 等于没配，不会强制上位）
#   2. force_base 和 promote 段互斥：
#      - 有 promote 段 = 能转职，自动判下位，不需要 force_base
#      - 两者同时配会导致转职后 total_level 重置为 1，经验计算异常
#   3. 想"强制上位"没有对应字段，普通上位职业不配即可自动判上位
#   4. 想"下位职业能升到 40 级"：有 promote 段的职业不配 max_level，
#      转职后等级重置，上位再升 20 级，总上限 40
# ============================================================

