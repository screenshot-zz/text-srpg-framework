units:
  - id: enemy1
    x: 10
    y: 18
    faction: enemy
    ai: guard
  - id: enemy_brigand
    x: 10
    y: 13
    faction: enemy
    ai: aggressive
  - move_to: {x: 14, y: 4}       # ← 目标点 A：宝箱
    reached_action: "story"
    reached_story: "test2_story"
    can_attack: false
    id: enemy_thief
    x: 17
    y: 1
    faction: enemy
    ai: move_to
  - follow_target: hero
    id: enemy2
    x: 7
    y: 2
    faction: ally
    ai: follow
deploy_points:
  - x: 3
    y: 2
  - x: 4
    y: 2
  - x: 3
    y: 3
  - x: 4
    y: 3
  - x: 4
    y: 1
  - x: 5
    y: 1

# ============================================================
# 商店坐标映射
# 哪个坐标开哪家店。同一个"商"字可以开不同店。
# 坐标不需要画"商"字也能生效（隐藏商店）。
# shop 的值对应 global.yaml::shops 的 key。
# ============================================================
shops:
  - {x: 5,  y: 9, shop: village_shop}    # 边境杂货铺
  - {x: 6, y: 9, shop: capital_shop}    # 王都武具店
  - {x: 7, y: 9, shop: magic_shop}      # 隐秘魔法屋

events:
  - id: intro
    trigger: start
    story: map1_intro
  - id: village
    trigger: interact
    x: 14
    y: 4
    story: village_gift
    condition: "unit_terrain == '村'"       # ← 脚下必须是"村"字
    once: true
  - id: ambush
    trigger: enter
    x: 13
    y: 0
    story: map1_ambush
  - id: win
    trigger: reach_point
    x: 10
    y: 18
    story: map1_clear
    result: win
    text: 占领城堡
  - id: lose_lord
    trigger: lord_dead
    story: game_over
    result: lose
    text: 艾伦阵亡
  - id: lose_all
    trigger: all_player_dead
    story: game_over
    result: lose
    text: 我方全灭
