# 物品定义。
#   武器：type=weapon，might/hit/crit/range
#         range：1 = 只能贴脸；"1-2" = 近远通吃；2 = 只能打 2 格
#                （贴脸既打不了也反不了 —— FE 弓的经典规则）
#         可选 damage_type: magic —— 走魔力/魔防结算（魔法书专用）
#         可选 durability: N —— 使用次数，归零后移除（不写 = 无限）
#         武器资格：只有职业 weapon_types 里列出的 weapon_type 才能用
#   杖：type=weapon + weapon_type: staff + no_attack: true
#         不进攻击池，走行动菜单「杖」。治疗量吃使用者魔力（含状态加成）。
#         special 分支：
#           repair   把友军最破损的一件武器耐久回满
#           revive   复活范围内阵亡友军（半血，原地起身）
#           summon   附近空格召出魔物（unit_id；切图自动消散）
#           teleport 使用者传送到友军身边的空位
#           script   触发剧情脚本（story 和/或 actions，万能钩子）
#         aoe_radius: N 以目标为中心的范围治疗
#   消耗品：type=consumable，formula 段写效果
#
# 使用次数（uses）规则 —— 初始化优先级：
#   1. 显式 uses 字段（含 null 表示无限）
#   2. 武器 durability（不写 = 无限）
#   3. 消耗品 consume=true（默认）= 1 次，consume=false = 无限
#   P.S. 攻击每次扣武器 1 点；归零自动移除，日志提示「XX已损坏」
#
# 消耗品可选字段：
#   price / target / range / condition / story / consume —— 见下方注释
#
# 消耗品 formula 键（可组合）：
#   heal / cure_status / apply_status

