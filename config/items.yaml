  description: "一封写着山贼斥候家乡地址的信（需先在交手中动摇他，他才肯听）"
  type: consumable
  formula: {}
  target: ["enemy"]
  range: 1
  # P2-12 链式招募：scout_reunion(吊坠)→scout_needle(动摇+1)→
  # scout_letter_hint(主动要信+1) 攒到 >=2 后，才对斥候可用
  condition: "target_uid == 'enemy_brigand' and target_can_recruit == 1 and vars.scout_lean == 1"
  story: "scout_recruited"
  consume: true

