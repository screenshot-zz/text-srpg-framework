# ============================================================
# 技能定义
#
# 两种技能：
#   被动（不写 type 或 type: passive）—— 持续生效
#     formula.stat_bonus      战斗数值修正（v7 核心扩展）
#     formula.damage_bonus    追加伤害（带 condition）
#     formula.aura            光环（给周围友军加成）
#   主动（type: active）—— 行动菜单里选
#     special: steal / dance  引擎分支
#     formula: heal / damage  通用效果
#
# 来源：
#   1. units.yaml 的 skills: [...]     初始技能
#   2. classes.yaml 的 skill_learn     升级学到
#   3. classes.yaml 的 class_skills    转职就有
#   4. event.py 的 add_skill 事件动作  剧情获得
# ============================================================

# ---- 通用被动 ----
charge:
  name: "冲锋"
  description: "移动后攻击伤害+2"
  formula: {damage_bonus: "2", condition: "moved_this_turn"}

command:
  name: "指挥"
  description: "周围2格友军命中+10"
  formula: {aura: {radius: 2, hit_bonus: 10, crit_bonus: 10}}

# ---- 通用主动 ----
steal:
  name: "偷窃"
  description: "对相邻敌人偷取一件道具（成功率看速度差与等级，同目标限一次）"
  type: active
  special: steal

dance:
  name: "舞蹈"
  description: "让相邻友军本回合再次行动"
  type: active
  special: dance

# ---- 职业专精（v7：转职立即获得，通过 formula.stat_bonus 改战斗数值）----
# 支持字段：attack / defense / hit / avoid / crit
# 数值会直接反映到单位面板（攻/防/命/回/杀）和战斗预测。
# 不影响 max_stats（HP/力/速这些属于"角色成长"，不是"战斗修正"）。

swordmaster_mastery:
  name: "剑之极致"
  description: "剑圣专精：必杀 +15"
  formula: {stat_bonus: {crit: 15}}

